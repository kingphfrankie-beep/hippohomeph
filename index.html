  <title>HippoHomesPH - Asset Scanner</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HippoHomes">

  <!-- Leaflet Mapping System -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    :root {
      --hippo-red: #e31e24;
      --hippo-dark: #0a0a0a;
      --hippo-glass: rgba(255, 255, 255, 0.03);
      --hippo-border: rgba(227, 30, 36, 0.2);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--hippo-dark);
      background-image: 
        radial-gradient(circle at 50% -20%, rgba(227, 30, 36, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
      color: #ffffff;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
      overscroll-behavior-y: contain;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1, h2, h3, .elegant-serif {
      font-family: 'Marcellus', serif;
    }

    .glass-3d {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .glass-edge {
      position: relative;
    }
    .glass-edge::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(to bottom right, rgba(255,255,255,0.2), transparent, rgba(227, 30, 36, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .preserve-3d { transform-style: preserve-3d; }
    .perspective-2000 { perspective: 2000px; }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .shimmer-sweep {
      position: relative;
      overflow: hidden;
    }
    .shimmer-sweep::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      animation: shimmer 2s infinite;
    }

    .btn-3d {
      position: relative;
      background: var(--hippo-red);
      color: #fff;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 0 0 rgba(227, 30, 36, 0.4);
    }
    .btn-3d:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(227, 30, 36, 0.4);
    }
    .btn-3d:active {
      transform: scale(0.95);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(227, 30, 36, 0.2);
      border-radius: 10px;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }

    /* Bottom Dock Floating effect */
    .dock-active {
      position: relative;
    }
    .dock-active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--hippo-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--hippo-red);
    }
  </style>
